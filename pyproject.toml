# Tool settings only: dependencies are pinned in requirements.txt, requirements-contract.txt and requirements-transport.txt (README).
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = ["E", "W", "I", "C90"]
# Full-width Chinese punctuation is the very text this service reads and writes.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# one prompt instruction per line, as the model reads it
"app/prompts.py" = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 20
